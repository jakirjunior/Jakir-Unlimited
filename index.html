<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My 3D Portfolio</title>

<meta name="description"
content="Premium 3D Developer Portfolio">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#03030b;
    color:#fff;
    font-family:
    Arial,
    Helvetica,
    sans-serif;
    overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

body::before{

    content:"";

    position:fixed;

    width:600px;
    height:600px;

    left:-250px;
    top:-200px;

    background:
    radial-gradient(
        circle,
        rgba(0,247,255,.18),
        transparent 65%
    );

    filter:blur(50px);

    pointer-events:none;

    z-index:-2;
}

body::after{

    content:"";

    position:fixed;

    width:600px;
    height:600px;

    right:-250px;
    bottom:-200px;

    background:
    radial-gradient(
        circle,
        rgba(168,85,247,.18),
        transparent 65%
    );

    filter:blur(50px);

    pointer-events:none;

    z-index:-2;
}

/* =========================
   NAVBAR
========================= */

.navbar{

    position:fixed;

    top:0;
    left:0;

    width:100%;

    z-index:1000;

    background:
    rgba(3,3,11,.65);

    backdrop-filter:
    blur(20px);

    border-bottom:
    1px solid
    rgba(255,255,255,.08);
}

.nav-container{

    max-width:1200px;

    margin:auto;

    padding:
    20px 25px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.logo{

    font-size:22px;

    font-weight:800;

    color:#00f7ff;

    text-decoration:none;

    letter-spacing:1px;

    text-shadow:
    0 0 20px
    rgba(0,247,255,.7);
}

.nav-links{

    display:flex;

    gap:30px;
}

.nav-links a{

    color:#aaa;

    text-decoration:none;

    font-size:14px;

    transition:.3s;
}

.nav-links a:hover{

    color:#00f7ff;

    text-shadow:
    0 0 10px
    rgba(0,247,255,.8);
}

/* =========================
   HERO
========================= */

.hero{

    min-height:100vh;

    max-width:1200px;

    margin:auto;

    padding:
    120px 25px
    70px;

    display:grid;

    grid-template-columns:
    1fr 1fr;

    align-items:center;

    gap:50px;
}

.hero-content{

    position:relative;

    z-index:5;
}

.small-title{

    color:#00f7ff;

    font-size:14px;

    font-weight:bold;

    letter-spacing:4px;

    margin-bottom:20px;
}

.hero h1{

    font-size:
    clamp(45px,7vw,85px);

    line-height:1;

    margin-bottom:20px;
}

.gradient{

    background:
    linear-gradient(
        90deg,
        #00f7ff,
        #8b5cf6,
        #ff2bd6
    );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;
}

.hero h2{

    font-size:
    clamp(22px,3vw,32px);

    color:#ddd;

    margin-bottom:20px;
}

.hero p{

    max-width:600px;

    color:#9295ad;

    font-size:16px;

    line-height:1.8;

    margin-bottom:30px;
}

/* =========================
   BUTTONS
========================= */

.buttons{

    display:flex;

    gap:15px;

    flex-wrap:wrap;
}

.btn{

    display:inline-block;

    padding:
    14px 25px;

    border-radius:50px;

    text-decoration:none;

    font-weight:bold;

    transition:.3s;

    border:
    1px solid
    rgba(255,255,255,.15);
}

.btn-primary{

    color:#02020a;

    background:
    linear-gradient(
        90deg,
        #00f7ff,
        #8b5cf6
    );

    box-shadow:
    0 0 30px
    rgba(0,247,255,.2);
}

.btn-secondary{

    color:#fff;

    background:
    rgba(255,255,255,.05);

    backdrop-filter:blur(10px);
}

.btn:hover{

    transform:
    translateY(-5px);

    box-shadow:
    0 15px 40px
    rgba(0,247,255,.2);
}

/* =========================
   3D AREA
========================= */

.hero-3d{

    min-height:500px;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;
}

#webgl{

    position:absolute;

    width:100%;

    height:100%;

    top:0;
    left:0;
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){

    .nav-links{
        display:none;
    }

    .hero{

        grid-template-columns:1fr;

        text-align:center;

        padding-top:120px;

        gap:20px;
    }

    .hero p{
        margin-left:auto;
        margin-right:auto;
    }

    .buttons{
        justify-content:center;
    }

    .hero-3d{
        min-height:400px;
    }

}

@media(max-width:500px){

    .hero h1{
        font-size:48px;
    }

    .hero h2{
        font-size:21px;
    }

}

</style>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

</head>


<body>

     NAVBAR
========================= -->

<div class="nav-container">

YOUR NAME
</a>

</a>

</a>

<a href="#skills">

</a>

<a href="#projects">

</a>

<a href="#contact">

</a>

</div>

</div>

</nav>


<!-- =========================
     HERO
========================= -->

<section class="hero" id="home">


<div class="hero-content">

<div class="small-title">
WELCOME TO MY WORLD
</div>

<h1>

I'M

<span class="gradient">
YOUR NAME
</span>

</h1>

<h2>
Creative Web Developer & 3D Designer
</h2>

<p>

I create modern websites, interactive
experiences and premium digital
interfaces with creative design and
3D animation.

</p>


<div class="buttons">

<a href="#projects"
class="btn btn-primary">

VIEW MY WORK

</a>

<a href="#contact"
class="btn btn-secondary">

CONTACT ME

</a>

</div>

</div>


<!-- 3D CANVAS -->

</div>


</section>

     JAVASCRIPT
========================= -->

</script>


</body>

</html>
