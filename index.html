<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#03030b;
    color:#fff;
    font-family:
    Arial,
    Helvetica,
    sans-serif;
    overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

body::before{

    content:"";

    position:fixed;

    width:600px;
    height:600px;

    left:-250px;
    top:-200px;

    background:
    radial-gradient(
        circle,
        rgba(0,247,255,.18),
        transparent 65%
    );

    filter:blur(50px);

    pointer-events:none;

    z-index:-2;
}

body::after{

    content:"";

    position:fixed;

    width:600px;
    height:600px;

    right:-250px;
    bottom:-200px;

    background:
    radial-gradient(
        circle,
        rgba(168,85,247,.18),
        transparent 65%
    );

    filter:blur(50px);

    pointer-events:none;

    z-index:-2;
}

/* =========================
   NAVBAR
========================= */

.navbar{

    position:fixed;

    top:0;
    left:0;

    width:100%;

    z-index:1000;

    background:
    rgba(3,3,11,.65);

    backdrop-filter:
    blur(20px);

    border-bottom:
    1px solid
    rgba(255,255,255,.08);
}

.nav-container{

    max-width:1200px;

    margin:auto;

    padding:
    20px 25px;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.logo{

    font-size:22px;

    font-weight:800;

    color:#00f7ff;

    text-decoration:none;

    letter-spacing:1px;

    text-shadow:
    0 0 20px
    rgba(0,247,255,.7);
}

.nav-links{

    display:flex;

    gap:30px;
}

.nav-links a{

    color:#aaa;

    text-decoration:none;

    font-size:14px;

    transition:.3s;
}

.nav-links a:hover{

    color:#00f7ff;

    text-shadow:
    0 0 10px
    rgba(0,247,255,.8);
}

/* =========================
   HERO
========================= */

.hero{

    min-height:100vh;

    max-width:1200px;

    margin:auto;

    padding:
    120px 25px
    70px;

    display:grid;

    grid-template-columns:
    1fr 1fr;

    align-items:center;

    gap:50px;
}

.hero-content{

    position:relative;

    z-index:5;
}

.small-title{

    color:#00f7ff;

    font-size:14px;

    font-weight:bold;

    letter-spacing:4px;

    margin-bottom:20px;
}

.hero h1{

    font-size:
    clamp(45px,7vw,85px);

    line-height:1;

    margin-bottom:20px;
}

.gradient{

    background:
    linear-gradient(
        90deg,
        #00f7ff,
        #8b5cf6,
        #ff2bd6
    );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;
}

.hero h2{

    font-size:
    clamp(22px,3vw,32px);

    color:#ddd;

    margin-bottom:20px;
}

.hero p{

    max-width:600px;

    color:#9295ad;

    font-size:16px;

    line-height:1.8;

    margin-bottom:30px;
}

/* =========================
   BUTTONS
========================= */

.buttons{

    display:flex;

    gap:15px;

    flex-wrap:wrap;
}

.btn{

    display:inline-block;

    padding:
    14px 25px;

    border-radius:50px;

    text-decoration:none;

    font-weight:bold;

    transition:.3s;

    border:
    1px solid
    rgba(255,255,255,.15);
}

.btn-primary{

    color:#02020a;

    background:
    linear-gradient(
        90deg,
        #00f7ff,
        #8b5cf6
    );

    box-shadow:
    0 0 30px
    rgba(0,247,255,.2);
}

.btn-secondary{

    color:#fff;

    background:
    rgba(255,255,255,.05);

    backdrop-filter:blur(10px);
}

.btn:hover{

    transform:
    translateY(-5px);

    box-shadow:
    0 15px 40px
    rgba(0,247,255,.2);
}

/* =========================
   3D AREA
========================= */

.hero-3d{

    min-height:500px;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;
}

#webgl{

    position:absolute;

    width:100%;

    height:100%;

    top:0;
    left:0;
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){

    .nav-links{
        display:none;
    }

    .hero{

        grid-template-columns:1fr;

        text-align:center;

        padding-top:120px;

        gap:20px;
    }

    .hero p{
        margin-left:auto;
        margin-right:auto;
    }

    .buttons{
        justify-content:center;
    }

    .hero-3d{
        min-height:400px;
    }

}

@media(max-width:500px){

    .hero h1{
        font-size:48px;
    }

    .hero h2{
        font-size:21px;
    }

}

</style>

<!-- =========================
     JAVASCRIPT
========================= -->
<script>

/* =========================================
   PREMIUM 3D PORTFOLIO - PART 2
========================================= */

const canvas = document.getElementById("webgl");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.z = 4;


/* =========================================
   RENDERER
========================================= */

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true,
    alpha: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


/* =========================================
   MAIN 3D OBJECT
========================================= */

const geometry = new THREE.IcosahedronGeometry(
    1.35,
    2
);


/* =========================================
   MATERIAL
========================================= */

const material = new THREE.MeshPhysicalMaterial({

    color: 0x7c3aed,

    metalness: 0.8,

    roughness: 0.18,

    transparent: true,

    opacity: 0.92,

    emissive: 0x351070,

    emissiveIntensity: 0.8

});


const mainObject = new THREE.Mesh(
    geometry,
    material
);

scene.add(mainObject);


/* =========================================
   WIREFRAME OUTLINE
========================================= */

const wireGeometry =
    new THREE.IcosahedronGeometry(
        1.43,
        2
    );

const wireMaterial =
    new THREE.MeshBasicMaterial({

        color: 0x00f7ff,

        wireframe: true,

        transparent: true,

        opacity: 0.35

    });

const wireObject = new THREE.Mesh(
    wireGeometry,
    wireMaterial
);

scene.add(wireObject);


/* =========================================
   GLOW RING
========================================= */

const ringGeometry =
    new THREE.TorusGeometry(
        1.8,
        0.025,
        16,
        100
    );

const ringMaterial =
    new THREE.MeshBasicMaterial({

        color: 0xff2bd6,

        transparent: true,

        opacity: 0.8

    });

const ring = new THREE.Mesh(
    ringGeometry,
    ringMaterial
);

ring.rotation.x = Math.PI / 2;

scene.add(ring);


/* =========================================
   SECOND RING
========================================= */

const ring2Geometry =
    new THREE.TorusGeometry(
        2.05,
        0.015,
        16,
        100
    );

const ring2Material =
    new THREE.MeshBasicMaterial({

        color: 0x00f7ff,

        transparent: true,

        opacity: 0.55

    });

const ring2 = new THREE.Mesh(
    ring2Geometry,
    ring2Material
);

ring2.rotation.x =
    Math.PI / 2.4;

scene.add(ring2);


/* =========================================
   LIGHTS
========================================= */

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        0.7
    );

scene.add(ambientLight);


const cyanLight =
    new THREE.PointLight(
        0x00f7ff,
        5,
        10
    );

cyanLight.position.set(
    3,
    2,
    4
);

scene.add(cyanLight);


const purpleLight =
    new THREE.PointLight(
        0x8b5cf6,
        5,
        10
    );

purpleLight.position.set(
    -3,
    -2,
    3
);

scene.add(purpleLight);


/* =========================================
   PARTICLES
========================================= */

const particleCount = 500;

const particleGeometry =
    new THREE.BufferGeometry();

const positions =
    new Float32Array(
        particleCount * 3
    );


for(
    let i = 0;
    i < particleCount;
    i++
){

    const radius =
        3 + Math.random() * 4;

    const theta =
        Math.random() * Math.PI * 2;

    const phi =
        Math.acos(
            2 * Math.random() - 1
        );

    positions[i * 3] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    positions[i * 3 + 1] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    positions[i * 3 + 2] =
        radius *
        Math.cos(phi);

}


particleGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);


const particleMaterial =
    new THREE.PointsMaterial({

        color: 0x00f7ff,

        size: 0.025,

        transparent: true,

        opacity: 0.75

    });


const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

scene.add(particles);


/* =========================================
   MOUSE CONTROL
========================================= */

let mouseX = 0;

let mouseY = 0;

let targetX = 0;

let targetY = 0;


window.addEventListener(
    "mousemove",
    function(event){

        mouseX =
            (event.clientX /
            window.innerWidth) -
            0.5;

        mouseY =
            (event.clientY /
            window.innerHeight) -
            0.5;

    }
);


/* =========================================
   TOUCH CONTROL
========================================= */

window.addEventListener(
    "touchmove",
    function(event){

        if(
            event.touches.length > 0
        ){

            const touch =
                event.touches[0];

            mouseX =
                (touch.clientX /
                window.innerWidth) -
                0.5;

            mouseY =
                (touch.clientY /
                window.innerHeight) -
                0.5;

        }

    },
    { passive:true }
);


/* =========================================
   ANIMATION
========================================= */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
        clock.getElapsedTime();


    /* Smooth Mouse Movement */

    targetX +=
        (mouseX * 0.8 - targetX)
        * 0.05;

    targetY +=
        (mouseY * 0.8 - targetY)
        * 0.05;


    /* Main Object */

    mainObject.rotation.x =
        time * 0.25 -
        targetY * 0.8;

    mainObject.rotation.y =
        time * 0.35 +
        targetX * 0.8;


    /* Wireframe */

    wireObject.rotation.x =
        mainObject.rotation.x;

    wireObject.rotation.y =
        mainObject.rotation.y;


    /* Floating Effect */

    mainObject.position.y =
        Math.sin(time * 1.2)
        * 0.12;


    wireObject.position.y =
        mainObject.position.y;


    /* Rings */

    ring.rotation.z =
        time * 0.4;

    ring2.rotation.z =
        -time * 0.25;


    ring.rotation.x =
        Math.PI / 2 +
        targetY * 0.5;

    ring2.rotation.y =
        targetX * 0.5;


    /* Particles */

    particles.rotation.y =
        time * 0.025;

    particles.rotation.x =
        time * 0.015;


    /* Light Movement */

    cyanLight.position.x =
        Math.sin(time) * 3;

    cyanLight.position.y =
        Math.cos(time) * 2;


    purpleLight.position.x =
        Math.cos(time) * -3;

    purpleLight.position.y =
        Math.sin(time) * -2;


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );

    }
);

    </script>
